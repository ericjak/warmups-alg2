<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra II Warm-Ups</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c6b55">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f4ef;--panel:#ffffff;--ink:#1d2330;--muted:#687080;--line:#e2e0d8;--accent:#2c6b55;--accent-ink:#fff;
--good:#2b7a4b;--bad:#b0402c;--warn:#a86d12;--good-bg:#e3f1e8;--bad-bg:#f8e3de;--warn-bg:#faefd9;
--grid:#e8e8e8;--axis:#555;--l0:#2f5d8a;--l1:#c4562c;--pt:#1d2330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1d2129;--ink:#e8e9ec;--muted:#9ba2ae;--line:#2e333d;--accent:#6cc09f;--accent-ink:#0d1117;
--good:#5fc189;--bad:#e67f68;--warn:#e2ab4d;--good-bg:#1e3428;--bad-bg:#3b2520;--warn-bg:#3a2f1b;
--grid:#2b3039;--axis:#9ba2ae;--l0:#71a5d8;--l1:#ec8a60;--pt:#e8e9ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1d2129;--ink:#e8e9ec;--muted:#9ba2ae;--line:#2e333d;--accent:#6cc09f;--accent-ink:#0d1117;
--good:#5fc189;--bad:#e67f68;--warn:#e2ab4d;--good-bg:#1e3428;--bad-bg:#3b2520;--warn-bg:#3a2f1b;
--grid:#2b3039;--axis:#9ba2ae;--l0:#71a5d8;--l1:#ec8a60;--pt:#e8e9ec;color-scheme:dark}
:root{--scrim:rgba(20,23,29,.45)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;font-weight:650}
#classbox select{font-weight:650;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:none;color:var(--ink);padding:7px 14px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
.today{margin-left:auto;color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg);cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--bad)}
main{max-width:1250px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.who{font-size:clamp(40px,7vw,84px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.skill{text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--accent);font-weight:650;margin-top:8px}
.prob{font-size:clamp(26px,3.6vw,44px);margin:20px 0 6px;line-height:1.5}
.ins{font-size:.72em;line-height:1.4;display:block}
.wp{font-size:.64em;line-height:1.5;display:block}
.math{white-space:nowrap}
.math i{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;padding:0 .03em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.08;margin:0 .06em}
.frac .nu{border-bottom:.08em solid currentColor;padding:0 .14em}
.frac .de{padding:0 .14em}
.sys{display:flex;flex-direction:column;gap:.3em;border-left:3px solid var(--ink);border-radius:12px 0 0 12px;padding:.15em 0 .15em .6em;margin:.35em 0 0 .3em;width:max-content}
.seq{margin-top:.25em}
.rel{margin-top:.25em;font-size:.85em}
table.vt{border-collapse:collapse;width:auto;font-size:.72em;margin-top:10px}
table.vt th,table.vt td{border:1.5px solid var(--ink);padding:3px 14px;text-align:center}
table.vt th{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;font-weight:400;background:var(--bg)}
.qgraph{margin-top:8px}
.map{width:min(100%,320px);height:auto;margin-top:6px;display:block}
.map ellipse{fill:none;stroke:var(--ink);stroke-width:1.5}
.map text{fill:var(--ink);font-size:17px;font-family:system-ui,sans-serif}
.map text.hd{fill:var(--muted);font-size:13px}
.map line{stroke:var(--accent);stroke-width:1.7}
.map .ah{fill:var(--accent)}
.ans{border-top:1px dashed var(--line);margin-top:16px;padding-top:16px;font-size:clamp(20px,2.6vw,32px);display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.ans .sub{font-size:.68em;color:var(--muted);margin-top:6px}
.graph{width:min(100%,420px);height:auto;flex:none}
.graph .gr{stroke:var(--grid);stroke-width:1}
.graph .ax{stroke:var(--axis);stroke-width:1.6}
.graph text{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
.graph .ln{stroke-width:3;fill:none}
.graph .ln0{stroke:var(--l0)} .graph .ln1{stroke:var(--l1)}
.graph .sh0{fill:var(--l0);opacity:.2}
.graph .pt{fill:var(--pt)}
.graph .ptl{fill:var(--ink);font-size:13px;font-weight:650}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:22px;padding:16px 30px}
.btn.danger{color:var(--bad)}
.btn.sm{font-size:13px;padding:5px 10px}
.res{font-size:18px;padding:14px 22px;font-weight:650}
.res.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.res.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.res.na{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.sep{flex:1}
select,input[type=text]{font:inherit;font-size:15px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
textarea{width:100%;font:15px/1.5 ui-monospace,Consolas,monospace;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.muted{color:var(--muted)} .small{font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:5;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:inherit;text-decoration:underline;font-weight:650;padding:0}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 18px;font-size:14px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle}
.cov th,.cov td{text-align:center;border:1px solid var(--line)}
.cov th:first-child,.cov td:first-child{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--panel)}
.cov thead th{font-size:12px;font-weight:600;color:var(--muted);min-width:80px;vertical-align:bottom}
.cov td.cell{font-weight:700;font-size:15px}
.c-good{background:var(--good-bg);color:var(--good)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-na{background:var(--warn-bg);color:var(--warn)}
.cov sup{font-weight:500;font-size:10px;margin-left:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 2px}
.legend span b{display:inline-block;width:22px;text-align:center;border-radius:4px;margin-right:4px}
.hist .p{font-size:14px}
.hist .p .graph,.hist .p .map{width:120px}
.hist .p table.vt{font-size:12px}
.tag{font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px}
section.set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:16px}
section.set h2{font-size:17px;margin:0 0 8px}
.catrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow label{flex:1;display:flex;gap:8px;align-items:center}
.empty{text-align:center;padding:60px 20px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
h3{margin:18px 0 6px;font-size:15px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.slots.one{grid-template-columns:1fr}
@media (max-width:900px){.slots{grid-template-columns:1fr}}
.slot{padding:18px 20px;transition:opacity .2s;min-width:0;overflow-wrap:break-word}
.slot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.slot.done{opacity:.75}
.slothead{display:flex;align-items:center;gap:12px}
.pnum{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;flex:none}
.slothead .skill{margin:0}
.slot .prob{font-size:clamp(22px,2.7vw,36px);margin:16px 0 6px}
.slot .ans{font-size:clamp(17px,1.9vw,24px);gap:16px}
.slot .graph{width:min(100%,330px)}
.whobox{margin-top:18px;min-height:64px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.slot .who{font-size:clamp(34px,4.6vw,60px)}
.tag.big{font-size:15px;padding:5px 12px}
.slot .res{font-size:16px;padding:11px 15px}
.small-row .btn{font-size:14px;padding:7px 12px}
.small-row select{font-size:14px;max-width:220px}
.center{justify-content:center}
table.syn{width:auto;border-collapse:collapse;margin:6px 0 2px;font-variant-numeric:tabular-nums;font-size:.95em}
table.syn td{border:none;padding:1px 9px;text-align:right}
table.syn td.k{border-right:1.5px solid currentColor;padding-right:8px}
table.syn tr.res td{border-top:1.5px solid currentColor}
table.syn tr.res td.k{border-top:none}
table.syn td.last{font-weight:700}
.rd{position:relative;display:inline-block;padding-left:.6em;margin-left:.04em;white-space:nowrap;line-height:1.15}
.rd.hasix{padding-left:.66em;margin-left:.12em}
.rd .rs{position:absolute;left:0;top:.04em;width:.6em;height:calc(100% - .04em);overflow:visible;fill:none;stroke:currentColor;stroke-width:.08em;stroke-linejoin:round;stroke-linecap:round}
.rd.hasix .rs{width:.66em}
.rd .rc{display:inline-block;border-top:.08em solid currentColor;padding:.06em .1em 0 .04em;line-height:1.15}
.frac .de .rd{margin-top:.18em}
.frac .nu .rd{margin-bottom:.06em}
.rd .ix{position:absolute;left:-.1em;bottom:42%;font-size:.5em;line-height:1}
.math sup{font-size:.68em;line-height:0}

.mback{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(100%,460px);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox.wide{width:min(100%,640px)}
.mbox h2{margin:0 0 8px;font-size:18px;text-wrap:balance}
.mbody{color:var(--muted);font-size:15px}
.mbox input[type=text]{width:100%;margin-top:10px}
.mbox textarea{margin-top:10px;font-size:13px}
.mrow{justify-content:flex-end;margin-top:18px}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.btn:focus-visible,nav button:focus-visible,.lvl button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lvl{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.lvl span{margin-right:6px}
.lvl button{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:30px;height:30px;padding:0;font-size:14px;font-weight:600}
.lvl button:first-of-type{border-radius:8px 0 0 8px}.lvl button:last-of-type{border-radius:0 8px 8px 0}
.lvl button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvtag{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.how{flex-basis:100%;font-size:.8em;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 12px}
.how .howt{font-size:.75em;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:650;margin-bottom:4px}
.how ol{margin:0;padding-left:1.4em}.how li{margin:3px 0}
.how .frac{font-size:.8em}
.classrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.classrow:last-child{border-bottom:none}
.classrow .nm{flex:1;font-weight:600}
.classrow.cur .nm::after{content:"  · selected";font-weight:400;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1>Algebra II Warm-Ups</h1>
  <div id="classbox"></div>
  <div id="lvlbox"></div>
  <nav id="nav">
    <button data-tab="warm">Warm-Up</button>
    <button data-tab="cov">Coverage</button>
    <button data-tab="hist">History</button>
    <button data-tab="setup">Setup</button>
  </nav>
  <div class="today" id="today"></div>
  <button class="btn sm" id="fsbtn" data-act="fs" hidden>Full screen</button>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="modal"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="importSkills" accept=".json,application/json" hidden>
<script>
/* ===================== math helpers ===================== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function R(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const rval=r=>r.n/r.d;
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do{v=rand(a,b)}while(v===0);return v};
const sgn=()=>Math.random()<.5?-1:1;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(v,p)=>{const f=10**p;return Math.round(v*f)/f};
function tryGen(f){for(let i=0;i<3000;i++){const r=f();if(r)return r}throw new Error('Could not generate a problem')}

const MINUS='−';
const num=n=>(n<0?MINUS:'')+Math.abs(n);
const f2=v=>{const s=Math.abs(v).toFixed(2);return(v<0&&s!=='0.00'?MINUS:'')+s};
const money=v=>'$'+(Number.isInteger(v)?v.toLocaleString('en-US'):v.toFixed(2));
const V=v=>`<i>${v}</i>`;
const M=s=>`<span class="math">${s}</span>`;
const frac=(n,d)=>`<span class="frac"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
const rAbs=r=>{const n=Math.abs(r.n);return r.d===1?String(n):frac(n,r.d)};
const rHTML=r=>(r.n<0?MINUS:'')+rAbs(r);
function expr(terms){let out='',first=true;
  for(const[c,v]of terms){if(c.n===0)continue;const neg=c.n<0,a=R(Math.abs(c.n),c.d);
    const body=v?((a.n===1&&a.d===1)?V(v):rAbs(a)+V(v)):rAbs(a);
    if(first){out+=(neg?MINUS:'')+body;first=false}else out+=(neg?` ${MINUS} `:' + ')+body}
  return first?'0':out}
const slopeInt=(m,b)=>`${V('y')} = ${expr([[m,'x'],[b,'']])}`;
const stdForm=(A,B,C)=>`${expr([[R(A),'x'],[R(B),'y']])} = ${num(C)}`;
const pt=(x,y)=>`(${num(x)}, ${num(y)})`;
const sys=(a,b)=>`<div class="sys"><div>${M(a)}</div><div>${M(b)}</div></div>`;
// decimal-coefficient linear equation, e.g. C = 35h + 60
const coefD=m=>m===1?'':m===-1?MINUS:num(m);
const linEq=(yv,xv,m,b,fmt=num)=>`${V(yv)} = ${coefD(m)}${V(xv)}${b===0?'':` ${b<0?MINUS:'+'} ${fmt(Math.abs(b))}`}`;
function ptSlope(m,x1,y1){
  const L=y1===0?V('y'):`${V('y')} ${y1<0?'+':MINUS} ${Math.abs(y1)}`;
  if(m.n===0)return`${L} = 0`;
  const c=(m.n===1&&m.d===1)?'':(m.n===-1&&m.d===1)?MINUS:rHTML(m);
  const bare=`${V('x')} ${x1<0?'+':MINUS} ${Math.abs(x1)}`;
  const inner=x1===0?V('x'):c===''?bare:`(${bare})`;
  return`${L} = ${c}${inner}`}
const SLOPES=[[1,1],[2,1],[3,1],[1,2],[1,3],[2,3],[3,2],[3,4],[4,3],[1,4]].flatMap(([n,d])=>[R(n,d),R(-n,d)]);
const OPS={'<':'&lt;','<=':'&le;','>':'&gt;','>=':'&ge;'};
const FLIP={'<':'>','<=':'>=','>':'<','>=':'<='};
const ord=n=>{const s=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return n+s};
const ins=s=>`<span class="ins">${s}</span>`;

/* ===================== drawing ===================== */
let svgN=0;
function graphSVG({lines=[],points=[],paths=[],N=10}){
  const S=400,u=S/(2*N),X=x=>+((x+N)*u).toFixed(2),Y=y=>+((N-y)*u).toFixed(2);
  const id='c'+(++svgN)+Math.random().toString(36).slice(2,6);
  let s=`<svg class="graph" viewBox="-16 -16 ${S+32} ${S+32}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}"><rect x="0" y="0" width="${S}" height="${S}"/></clipPath></defs>`;
  for(let i=-N;i<=N;i++){if(i===0)continue;s+=`<line class="gr" x1="${X(i)}" y1="0" x2="${X(i)}" y2="${S}"/><line class="gr" x1="0" y1="${Y(i)}" x2="${S}" y2="${Y(i)}"/>`}
  s+=`<line class="ax" x1="${X(0)}" y1="0" x2="${X(0)}" y2="${S}"/><line class="ax" x1="0" y1="${Y(0)}" x2="${S}" y2="${Y(0)}"/>`;
  for(let i=-N+2;i<N;i+=2){if(i===0)continue;
    s+=`<text x="${X(i)}" y="${Y(0)+13}" text-anchor="middle">${num(i)}</text><text x="${X(0)-4}" y="${Y(i)+3.5}" text-anchor="end">${num(i)}</text>`}
  s+=`<g clip-path="url(#${id})">`;
  lines.forEach((l,i)=>{const dash=l.dashed?' stroke-dasharray="12 8"':'';
    if(l.vx!==undefined){const x=X(l.vx);
      if(l.shade)s+=l.shade==='right'?`<rect class="sh0" x="${x}" y="0" width="${S-x}" height="${S}"/>`:`<rect class="sh0" x="0" y="0" width="${x}" height="${S}"/>`;
      s+=`<line class="ln ln${i}"${dash} x1="${x}" y1="-5" x2="${x}" y2="${S+5}"/>`}
    else{const f=x=>rval(l.m)*x+rval(l.b),a=-N-1,b=N+1,p0=[X(a),Y(f(a))],p1=[X(b),Y(f(b))];
      if(l.shade){const e=l.shade==='above'?-99999:99999;s+=`<polygon class="sh0" points="${p0} ${p1} ${p1[0]},${e} ${p0[0]},${e}"/>`}
      s+=`<line class="ln ln${i}"${dash} x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}"/>`}});
  paths.forEach(pp=>{s+=`<polyline class="ln ln0" points="${pp.map(([x,y])=>`${X(Math.max(-60,Math.min(60,x)))},${Y(Math.max(-60,Math.min(60,y)))}`).join(' ')}"/>`});
  s+='</g>';
  points.forEach(p=>{s+=`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="5"/>`;

function genDiscrim(lv){return tryGen(()=>{
  const want=pick(['two','one','none']);let a,b,c;
  if(want==='one'){const p=lv<=1?nz(-6,6):nz(-9,9),m=lv>=4?pick([2,3]):1;if(m>1&&gcd(m,p)!==1)return null;[a,b,c]=pmul([m,-p],[m,-p]);if(lv===3){a=-a;b=-b;c=-c}}
  else{a=lv<=2?1:lv===3?pick([-1,-2,1]):pick([2,3,4,5,-2,-3]);b=nz(-10,10);c=nz(-12,12)}
  const D=b*b-4*a*c,type=D>0?'two':D===0?'one':'none';if(type!==want)return null;
  const coef=[a,b,c],typeTxt={two:'Two real solutions',one:'One real solution',none:'Two imaginary solutions'}[type];
  const work=`${M(`${sq(par(b))} ${MINUS} 4(${num(a)})(${num(c)}) = ${num(D)}`)}`;
  if(lv===5){const n={two:2,one:1,none:0}[type];
    return{q:ins('Use the discriminant to find how many x-intercepts the graph has.')+`<div class="seq">${M(sform(coef))}</div>`,
      a:`<div>Discriminant ${M(num(D))}<br>${n} <i>x</i>-intercept${n===1?'':'s'}</div>`,graph:quadPlot(x=>peval(coef,x),[]),
      how:[`Discriminant: ${work}.`,D>0?'Positive: two real solutions, so the graph crosses the x-axis twice.':D===0?'Zero: one real solution, so the vertex touches the x-axis.':`Negative: no real solutions, so the graph never reaches the x-axis (it sits entirely ${a>0?'above':'below'} it).`],chk:()=>true}}
  return{q:ins('Find the discriminant. Then state the number and type of solutions.')+`<div class="seq">${M(poly(coef)+' = 0')}</div>`,a:`<div>Discriminant ${M(num(D))}<br>${typeTxt}</div>`,
    how:[`${M(`${V('a')} = ${num(a)}, ${V('b')} = ${num(b)}, ${V('c')} = ${num(c)}`)}; discriminant ${M(`${sq(V('b'))} ${MINUS} 4${V('a')}${V('c')}`)} = ${work}.`,'Positive: two real solutions. Zero: one real solution. Negative: two imaginary solutions.'],chk:()=>true}})}

/* ---------- Unit 2: polynomials ---------- */
function randPoly(deg,lo=-9,hi=9,lead=null){const c=[lead===null?nz(lo,hi):lead];for(let i=0;i<deg;i++)c.push(rand(lo,hi));return c}
function genPolyOrNot(lv){return tryGen(()=>{
  const yes=Math.random()<.5;let shown,a,how;
  const terms=c=>poly(c);
  if(yes){
    if(lv<=2){const deg=rand(2,5),c=randPoly(deg);if(lv===2){// terms out of order
        const parts=[];c.forEach((co,i)=>{if(co)parts.push([co,deg-i])});if(parts.length<3)return null;shuffle(parts);if(parts[0][1]===deg)parts.push(parts.shift());
        shown=parts.map(([co,p],i)=>{const t=(Math.abs(co)===1&&p>0?'':Math.abs(co))+xp(p);return i===0?(co<0?MINUS:'')+t:(co<0?` ${MINUS} `:' + ')+t}).join('')}
      else shown=terms(c);a=`<b>Yes</b> — degree ${deg}`;how=['Every exponent on <i>x</i> is a whole number and every coefficient is a real number, so it is a polynomial.',`The degree is the highest exponent: ${deg}.`]}
    else if(lv===3||lv===4){const k=nz(-6,6),e=rand(1,3),f1=[nz(-5,5),nz(-9,9)],f2=[nz(-5,5),nz(-9,9)],deg=e+2;
      shown=`${lead(k)}${xp(e)}(${poly(f1)})(${poly(f2)})`;a=`<b>Yes</b> — degree ${deg}`;how=['A product of polynomials is a polynomial.',`Add the degrees of the factors: ${e} + 1 + 1 = ${deg}.`]}
    else{const t=pick(['radcoef','fraccoef']),deg=rand(2,4);
      shown=t==='radcoef'?`${rad(pick([2,3,5,7]))}${xp(deg)} ${MINUS} ${rand(2,9)}${V('x')} + ${rand(1,9)}`:`${frac(xp(deg),pick([2,3,4]))} + ${rand(2,9)}${V('x')} ${MINUS} ${frac(1,pick([2,3,5]))}`;
      a=`<b>Yes</b> — degree ${deg}`;how=[t==='radcoef'?'A radical in a coefficient is fine; only the variable cannot be under a radical.':'Fraction coefficients are fine; the variable is not in a denominator.',`The highest exponent on <i>x</i> is ${deg}.`]}}
  else{const t=lv<=1?'denom':lv===2?pick(['denom','negexp']):lv===3?pick(['radvar','negexp']):lv===4?pick(['varexp','radvar','negexp']):pick(['fracexp','varexp','radvar']);
    const base=poly(randPoly(rand(1,3)).slice(0,-1).concat([0])).replace(/^0$/,`${rand(2,9)}${sq(V('x'))}`),k=rand(2,9);
    const bad={denom:[`${frac(k,V('x'))}`,'The variable is in a denominator.'],negexp:[`${k}${V('x')}${sup(MINUS+rand(1,3))}`,'It has a negative exponent on the variable.'],
      radvar:[pick([rad(`${k}${V('x')}`),`${k}${rad(V('x'))}`]),'The variable is under a radical.'],varexp:[`${k}${sup(V('x'))}`,'The variable is in an exponent.'],
      fracexp:[`${k}${V('x')}${sup('1/2')}`,'It has a fractional exponent on the variable.']}[t];
    shown=`${base} ${pick(['+',MINUS])} ${bad[0]}`;a=`<b>No</b> — ${bad[1].charAt(0).toLowerCase()+bad[1].slice(1)}`;how=['A polynomial has only whole-number exponents on the variable and no variable in a denominator, radical, or exponent.',bad[1]+' So it is not a polynomial.']}
  return{q:ins('Is this a polynomial function? If so, state its degree. If not, explain why.')+`<div class="seq">${M(`${V('f')}(${V('x')}) = ${shown}`)}</div>`,a:`<div>${a}</div>`,how,chk:()=>true}})}

function genSynthSub(lv){return tryGen(()=>{
  const deg=lv<=2?3:lv===3?4:5,c=randPoly(deg,lv>=4?-6:-5,lv>=4?6:5,lv>=4?nz(-3,3):nz(-4,4));
  if(lv>=3){const z=lv===3?1:2;for(let i=0;i<z;i++)c[rand(1,deg-1)]=0}
  const k=lv===1?rand(1,3):lv===2?-rand(1,3):lv===5?pick([-3,3,-2]):pick([-2,-1,1,2]),s=synth(c,k);if(Math.abs(s.r)>999)return null;
  return{q:ins(`Use synthetic substitution to evaluate ${M(`${V('P')}(${num(k)})`)}.`)+`<div class="seq">${M(`${V('P')}(${V('x')}) = ${poly(c)}`)}</div>`,a:`<div>${M(`${V('P')}(${num(k)}) = ${num(s.r)}`)}</div>`,
    how:[`Write the coefficients${c.includes(0)?', using 0 for each missing power':''}: ${M(c.map(num).join(', '))}.`,`Bring down the first, then repeatedly multiply by ${num(k)} and add:${synthTable(c,k,s)}`,`The last number is the value: ${M(`${V('P')}(${num(k)}) = ${num(s.r)}`)}.`],chk:()=>near(peval(c,k),s.r)}})}

function genFuncOps(lv){return tryGen(()=>{
  const f=[nz(-5,5),nz(-9,9)],h=[nz(-4,4),nz(-9,9)],g=[nz(-4,4),nz(-9,9),nz(-12,12)];
  const F=`${V('f')}(${V('x')}) = ${poly(f)}`,G=`${V('g')}(${V('x')}) = ${poly(g)}`,H=`${V('h')}(${V('x')}) = ${poly(h)}`;
  let given,ask,ans,how,check;
  if(lv===1){if(f[0]===-h[0])return null;const r=padd(f,h);given=[F,H];ask=`(${V('f')} + ${V('h')})(${V('x')})`;ans=poly(r);how=[`${M(`(${V('f')} + ${V('h')})(${V('x')}) = ${V('f')}(${V('x')}) + ${V('h')}(${V('x')}) = (${poly(f)}) + (${poly(h)})`)}.`,`Combine like terms: ${M(poly(r))}.`];check=()=>samePoly(r,padd(f,h))}
  else if(lv===2){const r=padd(g,pneg(f));given=[F,G];ask=`(${V('g')} ${MINUS} ${V('f')})(${V('x')})`;ans=poly(r);how=[`${M(`(${poly(g)}) ${MINUS} (${poly(f)})`)}: distribute the minus sign to every term of ${M(`${V('f')}(${V('x')})`)}.`,`Combine like terms: ${M(poly(r))}.`];check=()=>samePoly(r,padd(g,pneg(f)))}
  else if(lv===3){if(Math.random()<.5){const r=pmul(f,h);given=[F,H];ask=`(${V('f')}${V('h')})(${V('x')})`;ans=poly(r);how=[`Multiply ${M(`(${poly(f)})(${poly(h)})`)} using FOIL.`,`Combine like terms: ${M(poly(r))}.`];check=()=>samePoly(r,pmul(f,h))}
    else{const x=nz(-3,3),gv=peval(g,x),fv=peval(f,x);given=[F,G];ask=`(${V('g')} ${MINUS} ${V('f')})(${num(x)})`;ans=num(gv-fv);how=[`${M(`${V('g')}(${num(x)}) = ${num(gv)}`)} and ${M(`${V('f')}(${num(x)}) = ${num(fv)}`)}.`,`Subtract: ${M(`${num(gv)} ${MINUS} ${par(fv)} = ${num(gv-fv)}`)}.`];check=()=>true}}
  else if(lv===4){const r=pmul(g,f);given=[F,G];ask=`(${V('g')}${V('f')})(${V('x')})`;ans=poly(r);how=[`Multiply each term of ${M(`${V('f')}(${V('x')}) = ${poly(f)}`)} by each term of ${M(`${V('g')}(${V('x')})`)}: ${M(`${poly(pmul(g,[f[0],0]))}`)} and ${M(`${poly(pmul(g,[f[1]]))}`)}.`,`Add and combine like terms: ${M(poly(r))}.`];check=()=>samePoly(r,pmul(g,f))}
  else{const x=nz(-3,3),gv=peval(g,x),hv=peval(h,x);if(hv===0)return null;given=[G,H];ask=`(${frac(V('g'),V('h'))})(${num(x)})`;const q=R(gv,hv);ans=rHTML(q);how=[`${M(`${V('g')}(${num(x)}) = ${num(gv)}`)} and ${M(`${V('h')}(${num(x)}) = ${num(hv)}`)}.`,`Divide: ${M(`${frac(num(gv),num(hv))}${q.n===gv&&q.d===hv?'':' = '+rHTML(q)}`)}.`];check=()=>near(rval(q),gv/hv)}
  return{q:wp(`Let ${given.map(M).join(' and ')}. Find ${M(ask)}.`),a:`<div>${M(ans)}</div>`,how,chk:check}})}

function genPolyOps(lv){return tryGen(()=>{
  let shown,r,how,v=pick(['x','x','x','k']);const P=c=>poly(c,v);
  if(lv===1){const a=randPoly(rand(2,3)),b=randPoly(rand(1,3));r=padd(a,b);shown=`(${P(a)}) + (${P(b)})`;how=['Remove the parentheses and group like terms (same power).',`Combine: ${M(P(r))}.`]}
  else if(lv===2){const a=randPoly(3),b=randPoly(rand(2,3));if(Math.random()<.5)b[1]=0;r=padd(a,pneg(b));shown=`(${P(a)}) ${MINUS} (${P(b)})`;how=[`Distribute the minus sign: ${M(`${P(a)} + (${P(pneg(b))})`)}.`,`Combine like terms: ${M(P(r))}.`]}
  else if(lv===3){if(Math.random()<.5){const k=nz(-4,4),a=nz(-6,6);const sqr=[1,2*a,a*a];r=pmul([k,0],sqr);shown=`${k===1?'':k===-1?MINUS:num(k)}${V(v)}${sq(`(${xm(-a,v)})`)}`;how=[`Square the binomial first: ${M(`${sq(`(${xm(-a,v)})`)} = ${P(sqr)}`)}.`,`Multiply by ${M(`${num(k)}${V(v)}`)}: ${M(P(r))}.`]}
    else{const a=[1,nz(-6,6)],b=[nz(-3,3),nz(-6,6),nz(-9,9)];r=pmul(a,b);shown=`(${P(a)})(${P(b)})`;how=[`Multiply ${M(V(v))} by each term, then ${M(num(a[1]))} by each term: ${M(P(pmul([1,0],b)))} and ${M(P(pmul([a[1]],b)))}.`,`Combine like terms: ${M(P(r))}.`]}}
  else if(lv===4){const m=pick([1,1,2,3]),a=nz(-5,5);if(m>1&&Math.abs(a)>3)return null;const bin=[m,a];r=pmul(bin,pmul(bin,bin));shown=`(${P(bin)})${sup(3)}`;
    how=[`Use ${M(`(${V('a')} + ${V('b')})${sup(3)} = ${V('a')}${sup(3)} + 3${V('a')}${sup(2)}${V('b')} + 3${V('a')}${V('b')}${sup(2)} + ${V('b')}${sup(3)}`)} with ${M(`${V('a')} = ${m===1?'':m}${V(v)}`)}, ${M(`${V('b')} = ${num(a)}`)}.`,`${M(`${P([m**3,0,0,0])} + 3(${P([m*m,0,0])})(${num(a)}) + 3(${P([m,0])})(${a*a}) + ${par(a**3)}`)}.`,`Simplify: ${M(P(r))}.`]}
  else{const a=[1,nz(-5,5),nz(-6,6)],b=[1,nz(-5,5),nz(-6,6)];r=pmul(a,b);shown=`(${P(a)})(${P(b)})`;how=['Multiply every term of the first trinomial by every term of the second (9 products).',`${M(sq(V(v))+'·('+P(b)+') = '+P(pmul([1,0,0],b)))}, ${M(`${par(a[1])}${V(v)}·(${P(b)}) = ${P(pmul([a[1],0],b))}`)}, ${M(`${par(a[2])}·(${P(b)}) = ${P(pmul([a[2]],b))}`)}.`,`Combine like terms: ${M(P(r))}.`]}
  return{q:ins('Perform the operation. Write the answer in standard form.')+`<div class="seq">${M(shown)}</div>`,a:`<div>${M(P(r))}</div>`,how,chk:()=>true}})}

const remTerm=(r,divS)=>r===0?'':` ${r<0?MINUS:'+'} ${frac(Math.abs(r),divS)}`;
function genDivide(lv){return tryGen(()=>{
  if(lv<=3){const deg=lv===3?4:3,k=lv===3?nz(-3,3):nz(-4,4);let c;
    if(lv===1){c=pmul([1,-k],randPoly(2,-6,6,nz(-3,3)))}else{c=randPoly(deg,-7,7,nz(-3,3));if(lv===3){c[rand(1,2)]=0}}
    if(c.some(x=>Math.abs(x)>40))return null;const s=synth(c,k);if(lv===2&&s.r===0)return null;if(Math.abs(s.r)>99||s.q.some(x=>Math.abs(x)>99))return null;
    const divS=`${V('x')} ${k>0?MINUS:'+'} ${Math.abs(k)}`,ans=poly(s.q)+remTerm(s.r,divS);
    return{q:ins('Divide using synthetic division.')+`<div class="seq">${M(`(${poly(c)}) ÷ (${divS})`)}</div>`,a:`<div>${M(ans)}</div>`,
      how:[`Divide by ${M(divS)}, so use ${M(num(k))}${c.includes(0)?' and write 0 for each missing power':''}:${synthTable(c,k,s)}`,`The bottom row gives the quotient (one degree lower): ${M(poly(s.q))}.`,s.r===0?'The remainder is 0.':`The remainder ${M(num(s.r))} goes over the divisor: ${M(frac(num(s.r),divS))}.`],
      chk:()=>samePoly(padd(pmul(s.q,[1,-k]),[s.r]),c)}}
  if(lv===4){const k=nz(-3,3),yes=Math.random()<.7;let c,r2,r3;
    if(yes){r2=nz(-6,6);r3=nz(-6,6);c=pfromRoots([k,r2,r3])}else{c=randPoly(3,-9,9,1);if(peval(c,k)===0)return null}
    if(c.some(x=>Math.abs(x)>60))return null;const s=synth(c,k),divS=xm(k);
    const fac=yes?[k,r2,r3].sort((u,v)=>u-v):null;
    const facS=yes?(()=>{const cnt={};fac.forEach(r=>cnt[r]=(cnt[r]||0)+1);return Object.keys(cnt).map(Number).sort((u,v)=>u-v).map(r=>cnt[r]>1?sq(`(${xm(r)})`):`(${xm(r)})`).join('')})():'';
    return{q:ins(`Is ${M(divS)} a factor? If so, factor completely. If not, explain how you know.`)+`<div class="seq">${M(`${V('f')}(${V('x')}) = ${poly(c)}`)}</div>`,
      a:yes?`<div><b>Yes</b><br>${M(`${V('f')}(${V('x')}) = ${facS}`)}</div>`:`<div><b>No</b> — the remainder is ${M(num(s.r))}, not 0.</div>`,
      how:[`Divide by ${M(divS)} with synthetic division (use ${M(num(k))}):${synthTable(c,k,s)}`,yes?`The remainder is 0, so ${M(divS)} is a factor. The quotient is ${M(poly(s.q))}.`:`The remainder is ${M(num(s.r))}. A factor would leave a remainder of 0.`,...(yes?[`Factor the quadratic quotient: ${M(poly(s.q))} = ${M(`(${xm(r2)})(${xm(r3)})`)}.`]:[])],
      chk:()=>yes?samePoly(c,pfromRoots(fac)):!near(peval(c,k),0)}}
  const div=[1,nz(-4,4),nz(-5,5)],q=[nz(-3,3),nz(-6,6),nz(-6,6)],rem=[rand(-9,9),rand(-9,9)];if(rem[0]===0&&rem[1]===0)return null;
  const c=padd(pmul(div,q),rem);if(c.some(x=>Math.abs(x)>60))return null;const rp=ptrim(rem);
  const ans=`${poly(q)} ${'+'} ${frac(poly(rp),poly(div))}`;
  return{q:ins('Use long division to divide.')+`<div class="seq">${M(`(${poly(c)}) ÷ (${poly(div)})`)}</div>`,a:`<div>${M(ans)}</div>`,
    how:[`Divide the leading terms: ${M(`${frac(poly([c[0],0,0,0,0]),sq(V('x')))} = ${poly([q[0],0,0])}`)}. Multiply the divisor by it and subtract.`,`Repeat with the new leading term to get the rest of the quotient, ${M(poly(q))}.`,`Stop when the remainder's degree is less than 2. Remainder ${M(poly(rp))}, written over the divisor.`],
    chk:()=>samePoly(padd(pmul(div,q),rem),c)}})}

function genFactorSpecial(lv){return tryGen(()=>{
  let c,facs,how;const L=(m,b)=>`(${poly([m,b])})`;
  if(lv===1){const m=pick([1,1,2,3,4,5]),s=rand(1,9),g=pick([1,1,1,2,3]);if(gcd(m,s)!==1)return null;c=pmul([g],[m*m,0,-s*s]);
    facs=`${g>1?g:''}${L(m,-s)}${L(m,s)}`;how=[...(g>1?[`Factor out the GCF ${g}: ${M(`${g}(${poly([m*m,0,-s*s])})`)}.`]:[]),`Difference of squares with ${M(`${V('a')} = ${m===1?'':m}${V('x')}`)}, ${M(`${V('b')} = ${s}`)}: ${M(`${sq(V('a'))} ${MINUS} ${sq(V('b'))} = (${V('a')} ${MINUS} ${V('b')})(${V('a')} + ${V('b')})`)}.`,`${M(facs)}.`]}
  else if(lv<=3){const m=lv===2?1:pick([1,2,3]),s=rand(1,lv===2?5:4),plus=Math.random()<.5,g=lv===3&&m===1?pick([2,3,5]):1;if(gcd(m,s)!==1)return null;
    const base=[m**3,0,0,plus?s**3:-(s**3)];c=pmul([g],base);
    const A=m===1?V('x'):`${m}${V('x')}`,f1=L(m,plus?s:-s),f2=`(${poly([m*m,plus?-m*s:m*s,s*s])})`;facs=`${g>1?g:''}${f1}${f2}`;
    how=[...(g>1?[`Factor out the GCF ${g}: ${M(`${g}(${poly(base)})`)}.`]:[]),`${plus?'Sum':'Difference'} of cubes with ${M(`${V('a')} = ${A}`)}, ${M(`${V('b')} = ${s}`)}: ${M(plus?`${V('a')}${sup(3)} + ${V('b')}${sup(3)} = (${V('a')} + ${V('b')})(${sq(V('a'))} ${MINUS} ${V('a')}${V('b')} + ${sq(V('b'))})`:`${V('a')}${sup(3)} ${MINUS} ${V('b')}${sup(3)} = (${V('a')} ${MINUS} ${V('b')})(${sq(V('a'))} + ${V('a')}${V('b')} + ${sq(V('b'))})`)}.`,`${M(facs)}.`]}
  else if(lv===4){const p=rand(1,5);let q;if(Math.random()<.6){do{q=rand(1,6)}while(q===p);const P2=p*p,Q2=q*q;c=[1,0,-(P2+Q2),0,P2*Q2];const s=[p,q].sort((u,v)=>u-v);facs=`${L(1,-s[0])}${L(1,s[0])}${L(1,-s[1])}${L(1,s[1])}`;
      how=[`Treat it as a quadratic in ${M(sq(V('x')))}: ${M(`(${sq(V('x'))} ${MINUS} ${P2})(${sq(V('x'))} ${MINUS} ${Q2})`)}.`,`Each factor is a difference of squares: ${M(facs)}.`]}
    else{q=rand(1,5);const P2=p*p,Q2=q*q;c=[1,0,Q2-P2,0,-P2*Q2];if(Q2===P2)return null;facs=`${L(1,-p)}${L(1,p)}(${poly([1,0,Q2])})`;
      how=[`Treat it as a quadratic in ${M(sq(V('x')))}: ${M(`(${sq(V('x'))} ${MINUS} ${P2})(${sq(V('x'))} + ${Q2})`)}.`,`${M(`${sq(V('x'))} ${MINUS} ${P2}`)} is a difference of squares; ${M(`${sq(V('x'))} + ${Q2}`)} does not factor over the integers. ${M(facs)}.`]}}
  else{if(Math.random()<.6){const a=nz(-6,6),b=rand(1,5);c=pmul([1,a],[1,0,-b*b]);facs=`${L(1,a)}${L(1,-b)}${L(1,b)}`;
      how=[`Group: ${M(`(${poly([1,a,0,0])}) + (${poly([-b*b,-a*b*b])})`)}.`,`Factor each group: ${M(`${sq(V('x'))}${L(1,a)} ${MINUS} ${b*b}${L(1,a)} = ${L(1,a)}(${poly([1,0,-b*b])})`)}.`,`Difference of squares: ${M(facs)}.`]}
    else{const s=rand(1,4);c=[1,0,0,0,-(s**4)];facs=`(${poly([1,0,s*s])})${L(1,-s)}${L(1,s)}`;how=[`Difference of squares: ${M(`(${poly([1,0,s*s])})(${poly([1,0,-s*s])})`)}.`,`Factor ${M(poly([1,0,-s*s]))} again: ${M(facs)}.`]}}
  return{q:ins('Factor completely.')+`<div class="seq">${M(poly(c))}</div>`,a:`<div>${M(facs)}</div>`,how,chk:()=>true}})}

function divisors(n){n=Math.abs(n);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d}
function genRatZeros(lv){return tryGen(()=>{
  const a=lv<=2?1:lv===3?2:lv===4?pick([3,4]):pick([2,4,6]),c0=lv===1?pick([4,6,8,9,10]):lv===2?pick([12,15,18,20]):lv===3?pick([3,5,6,9]):lv===4?pick([4,6,8]):pick([9,10,12,15]);
  const deg=rand(3,4),c=[a];for(let i=1;i<deg;i++)c.push(rand(-9,9));c.push(c0*sgn());
  const P=divisors(c0),Q=divisors(a),set=new Map();P.forEach(p=>Q.forEach(q=>{const r=R(p,q);set.set(rval(r),r)}));
  const list=[...set.values()].sort((u,v)=>rval(u)-rval(v));
  return{q:ins('Use the Rational Zero Theorem to list all possible rational zeros.')+`<div class="seq">${M(`${V('f')}(${V('x')}) = ${poly(c)}`)}</div>`,

const nroot=(n,inner)=>n===2?rad(inner):rad(inner,n);

function nthFree(c,n){let k=1,m=c;for(let f=2;ipow(f,n)<=m;f++)while(m%ipow(f,n)===0){m/=ipow(f,n);k*=f}return[k,m]} // c = k^n · m
const NTH_FREE={2:[2,3,5,6,7,10,11],3:[2,3,4,5,6,7,9,10],4:[2,3,5,6,7,8],5:[2,3,4,5,6],6:[2,3,4,5]};

function genNthRoot(lv){return tryGen(()=>{
  let n,a,r;
  if(lv===1){n=pick([2,3]);r=rand(2,n===2?15:7);a=ipow(r,n)}
  else if(lv===2){n=pick([3,5]);r=rand(2,n===3?7:3);a=-ipow(r,n)}

    how:['Odd index: exactly one real root, with the same sign as a. Even index: two roots (±) if a > 0, one if a = 0, none if a < 0.',why],

function genRewriteRad(lv){return tryGen(()=>{
  const n=lv<=1?pick([3,4,5]):pick([3,4,5,6,7]);let m=lv<=1?1:pick([2,3,4,5,7]);if(gcd(m,n)!==1)return null;

  return(neg?MINUS:'')+(B?frac(T||'1',B):T)}

function genLikeRad(lv){return tryGen(()=>{
  let n,shown,ans,how,check;const T=(c,i,r)=>`${c===1?'':c===-1?MINUS:num(c)}${nroot(i,r)}`,op=s=>s<0?` ${MINUS} `:' + ';
  if(lv===1){n=pick([2,3,4,6]);const r=pick(NTH_FREE[n]),a=rand(2,12),b=rand(1,12),s=sgn(),c=a+s*b;if(c===0)return null;
    shown=`${T(a,n,r)}${op(s)}${T(b,n,r)}`;ans=radTerm(c,n,r);how=['Same index and same radicand, so these are like radicals.',`Add or subtract the coefficients: ${M(`${a} ${s<0?MINUS:'+'} ${b} = ${num(c)}`)}, giving ${M(ans)}.`];check=()=>true}
  else if(lv===2||lv===3||(lv===4&&Math.random()<.5)){n=pick([2,3,3,4]);const r=pick(NTH_FREE[n].slice(0,4)),k1=lv===2?1:rand(2,n===2?5:3),k2=rand(2,n===2?5:3),a=rand(1,8),b=rand(1,8),s=sgn(),c=a*k1+s*b*k2;if(c===0)return null;
    const r1=ipow(k1,n)*r,r2=ipow(k2,n)*r;shown=`${T(a,n,r1)}${op(s)}${T(b,n,r2)}`;ans=radTerm(c,n,r);
    how=[`Simplify each radical first: ${k1>1?M(`${nroot(n,r1)} = ${radTerm(k1,n,r)}`)+', ':''}${M(`${nroot(n,r2)} = ${radTerm(k2,n,r)}`)}.`,`Now they are like radicals: ${M(`${radTerm(a*k1,n,r)}${op(s)}${radTerm(b*k2,n,r)} = ${ans}`)}.`];check=()=>near(a*realRoot(r1,n)+s*b*realRoot(r2,n),c*realRoot(r,n))}
  else if(lv===4){n=pick([2,3]);const r1=pick(NTH_FREE[n].slice(0,4)),idx2=Math.random()<.5?n:(n===2?3:2);let r2;do{r2=pick(NTH_FREE[idx2].slice(0,5))}while(idx2===n&&r2===r1);const k=rand(1,3),a=rand(2,9),b=rand(2,9);
    const R2=ipow(k,idx2)*r2;shown=`${T(a,n,r1)} + ${T(b,idx2,R2)}`;const simp2=radTerm(b*k,idx2,r2);ans=idx2===n&&k===1?shown:`${radTerm(a,n,r1)} + ${simp2}`;
    how=[`Simplify each radical${k>1?`: ${M(`${nroot(idx2,R2)} = ${radTerm(k,idx2,r2)}`)}`:''}.`,`${idx2!==n?'The indexes are different':'The radicands are different'}, so these are not like radicals and cannot be combined. ${M(ans)} is simplified.`];check=()=>true;
    return{q:ins('Simplify if possible.')+`<div class="seq">${M(shown)}</div>`,a:`<div>${M(ans)}<div class="sub">not like radicals</div></div>`,how,chk:check}}
  else{n=pick([2,2,3]);const t=rand(1,3),q1=n===2?pick([1,3,5].filter(q=>(q-1)/2<=t)):pick([1,4].filter(q=>(q-1)/3<=t)),e1=t-(q1-1)/n,q2=n*t+1,s1=rand(1,3),s2=rand(1,3),c1=rand(1,4),c2=rand(1,4),s=sgn();
    if(e1<1)return null;const sq1=ipow(s1,n),sq2=ipow(s2,n),coef=c1*s1+s*c2*s2;if(coef===0)return null;
    const xe=e=>e===0?'':e===1?V('x'):V('x')+sup(e);
    shown=`${c1===1?'':c1}${xe(e1)}${nroot(n,`${sq1===1?'':sq1}${xe(q1)}`)}${op(s)}${c2===1?'':c2}${nroot(n,`${sq2===1?'':sq2}${xe(q2)}`)}`;
    ans=`${coef===1?'':coef===-1?MINUS:num(coef)}${xe(t)}${nroot(n,V('x'))}`;
    how=[`Simplify each radical: ${M(`${nroot(n,`${sq1===1?'':sq1}${xe(q1)}`)} = ${s1===1?'':s1}${xe((q1-1)/n)}${nroot(n,V('x'))}`)} and ${M(`${nroot(n,`${sq2===1?'':sq2}${xe(q2)}`)} = ${s2===1?'':s2}${xe(t)}${nroot(n,V('x'))}`)}.`,
      `Both terms are now multiples of ${M(`${xe(t)}${nroot(n,V('x'))}`)}: combine the coefficients ${M(`${c1*s1} ${s<0?MINUS:'+'} ${c2*s2} = ${num(coef)}`)}.`];
    check=()=>{const X=1.7;return near(c1*X**e1*realRoot(sq1*X**q1,n)+s*c2*realRoot(sq2*X**q2,n),coef*X**t*realRoot(X,n))}}
  return{q:ins(lv>=5?'Simplify. Assume all variables are positive.':'Simplify.')+`<div class="seq">${M(shown)}</div>`,a:`<div>${M(ans)}</div>`,how,chk:check}})}

/* ===================== state ===================== */
const KEY='alg2-warmups-v1',OLDKEY='alg2-warmups-none';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtText=s=>esc(s).replace(/\^(-?\w+|\([^)]*\))/g,'<sup>$1</sup>');
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function newClass(name,students){return{id:'k-'+uid(),name,students,level:3,enabled:{},log:[],absent:{date:'',names:[]}}}
function defaults(){return{version:2,classes:[],current:null,custom:[]}}
function fromV1(o){const k=newClass('B Period',o.students||[]);k.level=3;k.enabled=Object.assign({},o.enabled||{});
  (o.custom||[]).forEach(c=>{if(c.enabled===false)k.enabled[c.id]=false});k.log=o.log||[];k.absent=o.absent||{date:'',names:[]};
  return{version:2,classes:[k],current:k.id,custom:(o.custom||[]).map(c=>({id:c.id,name:c.name,items:c.items||[]}))}}
function normalize(d){if(!d||typeof d!=='object')throw 0;if(!Array.isArray(d.classes)){if(!Array.isArray(d.students))throw 0;return fromV1(d)}
  d.version=2;d.custom=d.custom||[];d.classes.forEach(k=>{k.level=k.level||3;k.enabled=k.enabled||{};k.log=k.log||[];k.absent=k.absent||{date:'',names:[]};k.students=k.students||[]});
  if(!d.classes.some(k=>k.id===d.current))d.current=d.classes[0]?d.classes[0].id:null;return d}
let S=defaults(),canSave=true;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=normalize(JSON.parse(raw));return}
  const old=localStorage.getItem(OLDKEY);if(old){S=fromV1(JSON.parse(old));return}}catch(e){canSave=false}S=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));canSave=true}catch(e){canSave=false}renderBanner()}
const C=()=>S.classes.find(k=>k.id===S.current)||null;

function cats(all){const k=C(),on=id=>!k||k.enabled[id]!==false;
  const list=BUILTIN.map(c=>({...c,builtin:true,enabled:on(c.id)}))
  .concat(S.custom.map(c=>({...c,builtin:false,enabled:on(c.id),gen:()=>{const it=pick(c.items);return{q:fmtText(it.q),a:`<div>${fmtText(it.a)}</div>`}}})));
  return all?list:list.filter(c=>c.enabled&&(c.builtin||c.items.length))}
const catName=id=>(cats(true).find(c=>c.id===id)||{name:'(deleted skill)'}).name;
function absentToday(){const k=C();if(k.absent.date!==todayStr())k.absent={date:todayStr(),names:[]};return k.absent.names}

function stats(){const k=C(),st={},today=todayStr();
  k.students.forEach(n=>st[n]={turns:0,last:0,by:{}});
  const catCorrect={},todayUses={};
  for(const r of k.log){const s=st[r.student];
    if(r.t.slice(0,10)===today)todayUses[r.cat]=(todayUses[r.cat]||0)+1;
    if(r.result==='correct'){(catCorrect[r.cat]=catCorrect[r.cat]||new Set()).add(r.student)}
    if(!s)continue;s.turns++;s.last=Math.max(s.last,Date.parse(r.t));
    const b=s.by[r.cat]=s.by[r.cat]||{c:0,i:0,n:0};b[r.result==='correct'?'c':r.result==='incorrect'?'i':'n']++}
  return{st,catCorrect,todayUses}}
function cmp(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0}
function pickStudent(exclude=[]){const{st}=stats(),ab=absentToday();
  const c=C().students.filter(n=>!ab.includes(n)&&!exclude.includes(n));if(!c.length)return null;
  return c.map(n=>({n,k:[st[n].turns,st[n].last,Math.random()]})).sort((a,b)=>cmp(a.k,b.k))[0].n}
function pickCat(student,exclude=[]){const{st,catCorrect,todayUses}=stats(),list=cats().filter(c=>!exclude.includes(c.id));
  if(!list.length)return null;const by=(st[student]||{by:{}}).by;
  return list.map(c=>{const b=by[c.id]||{c:0,i:0,n:0};return{c,k:[b.c>0?1:0,b.c+b.i,todayUses[c.id]||0,(catCorrect[c.id]||new Set()).size,Math.random()]}})
    .sort((a,b)=>cmp(a.k,b.k))[0].c}

/* ===================== UI ===================== */
let tab='warm',round=null,toastTimer=null,editing=null;
const $=s=>document.querySelector(s);
const pickLevel=()=>rand(1,(C()&&C().level)||3);
function genFor(cat,d){try{return cat.gen(d)}catch(e){return{q:'Could not make a problem — press New problem.',a:''}}}
function fill(slot,cat){slot.cat=cat.id;slot.lv=cat.builtin?pickLevel():null;slot.p=genFor(cat,slot.lv);slot.shown=false}
function makeSlot(student,cat){const s={student,revealed:false,result:null};fill(s,cat);return s}
function newRound(){if(!C())return;const s1=pickStudent();if(!s1){round=null;return render()}
  const c1=pickCat(s1);if(!c1){round=null;return render()}const slots=[makeSlot(s1,c1)];
  const s2=pickStudent([s1]);if(s2){const c2=pickCat(s2,[c1.id])||pickCat(s2);slots.push(makeSlot(s2,c2))}
  round={slots};render()}
const activeIdx=()=>round?round.slots.findIndex(s=>!s.result):-1;
const usesCat=id=>round&&round.slots.some(s=>s.cat===id);

function renderBanner(){$('#banner').innerHTML=canSave?'':'<div class="banner">This browser isn\'t letting the app save. Use Export backup on the Setup tab before closing, or open the file in Chrome or Edge.</div>'}
function renderHeader(){
  $('#classbox').innerHTML=S.classes.length?`<select id="classpick" title="Switch class">${S.classes.map(k=>`<option value="${k.id}" ${k.id===S.current?'selected':''}>${esc(k.name)}</option>`).join('')}</select>`:'';
  $('#lvlbox').innerHTML=C()?`<span class="lvl" title="Each problem is a random level from 1 up to this maximum"><span>Max difficulty</span>${[1,2,3,4,5].map(v=>`<button data-act="lvl" data-v="${v}" class="${v===C().level?'on':''}">${v}</button>`).join('')}</span>`:'';
  if(!C()){$('#today').innerHTML='';return}
  const ab=absentToday(),n=C().log.filter(r=>r.t.slice(0,10)===todayStr()).length;
  $('#today').innerHTML=`<span>Today: ${n} turn${n===1?'':'s'}</span>`+(ab.length?`<span>· Absent:</span>`+ab.map(a=>`<button class="chip" data-act="unabsent" data-name="${esc(a)}" title="Mark present">${esc(a)} ✕</button>`).join(''):'')}

const noClass=()=>`<div class="card empty"><p>No classes yet.</p><button class="btn primary" data-tab="setup">Add a class in Setup</button></div>`;
const howHTML=h=>h&&h.length?`<div class="how"><div class="howt">How to solve</div><ol>${h.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'';
function viewWarm(){if(!C())return noClass();
  if(!C().students.length)return`<div class="card empty"><p>${esc(C().name)} has no students yet. Add the roster on the Setup tab.</p></div>`;
  if(!cats().length)return`<div class="card empty"><p>No skills are turned on for ${esc(C().name)}. Turn some on in Setup.</p></div>`;
  if(!round)return`<div class="card empty"><button class="btn primary big" data-act="newround">Start warm-up</button>
    <p class="muted">${pickStudent()?'Shows two problems. Names stay hidden until you reveal them.':'Everyone is marked absent today.'}</p></div>`;
  const act=activeIdx(),all=cats(),lab={correct:['✓ Correct','c-good'],incorrect:['✗ Incorrect','c-bad'],noattempt:["Didn't attempt",'c-na']};
  let h=`<div class="slots${round.slots.length===1?' one':''}">`;
  round.slots.forEach((s,i)=>{
    h+=`<div class="card slot${i===act?' active':''}${s.result?' done':''}">
      <div class="slothead"><span class="pnum">${i+1}</span><span class="skill">${esc(catName(s.cat))}</span>${s.lv?`<span class="lvtag" title="Difficulty level">Level ${s.lv}</span>`:''}</div>
      <div class="prob">${s.p.q}</div>
      ${s.shown?`<div class="ans">${s.p.a||''}${s.p.graph||''}${howHTML(s.p.how)}</div>`:''}
      <div class="whobox">`;
    if(!s.revealed)h+=i===act?`<button class="btn primary big" data-act="reveal" data-i="${i}">Who's solving #${i+1}?</button>`
      :`<span class="muted">Name appears after #${act+1} is marked.</span>`;
    else h+=`<div class="who">${esc(s.student)}</div>${s.result?`<span class="tag big ${lab[s.result][1]}">${lab[s.result][0]}</span>`:''}`;
    h+=`</div>`;
    const grading=s.revealed&&!s.result;
    if(grading)h+=`<div class="row">
        <button class="btn res ${s.shown?'':'primary'}" data-act="toggle" data-i="${i}">${s.shown?'Hide answer':'Show answer'}</button>
        <button class="btn res good" data-act="rec" data-i="${i}" data-r="correct">✓ Correct</button>
        <button class="btn res bad" data-act="rec" data-i="${i}" data-r="incorrect">✗ Incorrect</button>
        <button class="btn res na" data-act="rec" data-i="${i}" data-r="noattempt">Didn't attempt</button></div>
      <div class="row"><button class="btn" data-act="absent" data-i="${i}">Absent today</button>
        <button class="btn" data-act="someoneelse" data-i="${i}">Call someone else</button></div>`;
    h+=`<div class="row small-row">
        ${grading?'':`<button class="btn" data-act="toggle" data-i="${i}">${s.shown?'Hide answer':'Show answer'}</button>`}
        ${s.result?'':`<button class="btn" data-act="newprob" data-i="${i}">New problem</button>
        <select data-act="setcat" data-i="${i}" title="Change skill">${all.map(c=>`<option value="${c.id}" ${c.id===s.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}
      </div></div>`});
  h+='</div>';
  h+=act<0?`<div class="row center"><button class="btn primary big" data-act="newround">Next round</button></div>`:'';
  return h+`<div class="kbd">Keys: Enter = reveal name / next round · 1 = correct · 2 = incorrect · 3 = didn't attempt · Space = show/hide answer for the current problem</div>`}

function viewCov(){if(!C())return noClass();const{st,catCorrect}=stats(),list=cats(true).filter(c=>c.enabled),k=C(),n=k.students.length;
  if(!n)return`<p>${esc(k.name)} has no students yet.</p>`;
  let pairs=0;k.students.forEach(s=>list.forEach(c=>{if((st[s].by[c.id]||{}).c)pairs++}));
  const tot=n*list.length;
  let h=`<p><b>${esc(k.name)}:</b> <b>${pairs}</b> of ${tot} student–skill pairs answered correctly (${tot?Math.round(100*pairs/tot):0}%). Only skills turned on for this class are shown.</p>
  <div class="legend"><span><b class="c-good">✓</b>got it right at least once</span><span><b class="c-bad">✗</b>tried, not right yet</span><span><b class="c-na">–</b>didn't attempt</span><span>small number = times asked</span></div>
  <div class="tablewrap"><table class="cov"><thead><tr><th>Student</th><th>Turns</th>${list.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>`;
  for(const s of k.students){h+=`<tr><td>${esc(s)}</td><td>${st[s].turns}</td>`;
    for(const c of list){const b=st[s].by[c.id];if(!b){h+='<td class="cell"></td>';continue}
      const t=b.c+b.i+b.n,cls=b.c?'c-good':b.i?'c-bad':'c-na',sym=b.c?'✓':b.i?'✗':'–';

    <p class="small muted">Skills you add are available to all your classes. Type one problem per line as <code>problem | answer</code>. Use ^ for exponents (x^2). Example: <code>Simplify 3(x − 4) + 2x | 5x − 12</code></p>
    <input type="text" id="cname" placeholder="Skill name" value="${e?esc(e.name):''}" style="width:100%;margin-bottom:8px">
    <textarea id="citems" rows="7" placeholder="Solve 2x + 5 = 17 | x = 6">${e?esc(e.items.map(i=>i.q+' | '+i.a).join('\n')):''}</textarea>
    <div class="row"><button class="btn primary" data-act="savecat">${e?'Save changes':'Add skill'}</button>${e?'<button class="btn" data-act="canceledit">Cancel</button>':''}</div></section>`}
  h+=`<section class="set"><h2>Backup &amp; sharing</h2>
    <p class="small muted">Everything is saved in this browser. Export a backup now and then. History stays on this device only. A backup includes all classes, rosters, history and your added skills.</p>
    <div class="row"><button class="btn primary" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button></div>
    <h3>Share added skills</h3><p class="small muted">Sends only the skills you added (no students or history), so another teacher can import them into their copy.</p>
    <div class="row"><button class="btn" data-act="exportskills" ${S.custom.length?'':'disabled'}>Export my added skills</button><button class="btn" data-act="importskills">Import skills</button></div>
    <h3>Clear history</h3><p class="small muted">Removes recorded turns and today's absences. Classes, rosters and skills are kept.</p>
    <div class="row">${k?`<button class="btn danger" data-act="clearclass">Clear ${esc(k.name)} history</button>`:''}<button class="btn danger" data-act="clearall" ${S.classes.length?'':'disabled'}>Clear history for all classes</button></div></section>`;
  return h}

function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));renderHeader();renderBanner();
  $('#main').innerHTML=tab==='warm'?viewWarm():tab==='cov'?viewCov():tab==='hist'?viewHist():viewSetup();
  if(tab==='warm')fitSlots()}
// Safety net: anything still wider than its card is allowed to wrap or shrink, so nothing runs off the edge.
function fitSlots(){document.querySelectorAll('.slot').forEach(el=>{const right=el.getBoundingClientRect().right-parseFloat(getComputedStyle(el).paddingRight);
  el.querySelectorAll('.math').forEach(m=>{if(m.getBoundingClientRect().right>right+1)m.style.whiteSpace='normal'});
  el.querySelectorAll('table.vt').forEach(t=>{let f=parseFloat(getComputedStyle(t).fontSize);while(t.getBoundingClientRect().right>right+1&&f>11){f-=1;t.style.fontSize=f+'px'}})})}
window.addEventListener('resize',()=>{if(tab==='warm')render()});

function toast(msg,undo){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast"><span>${msg}</span>${undo?'<button data-act="undo">Undo</button>':''}</div>`;
  window._undo=undo;toastTimer=setTimeout(()=>{$('#toast').innerHTML='';window._undo=null},6000)}

function snapshot(){return JSON.parse(JSON.stringify(round))}
function record(i,result){const s=round&&round.slots[i];if(!s||!s.revealed||s.result)return;const snap=snapshot(),k=C();
  const id=uid();
  k.log.push({id,t:new Date().toISOString(),student:s.student,cat:s.cat,lv:s.lv,result,q:s.p.q});save();
  s.result=result;s.shown=true;const nx=round.slots[i+1];if(nx)nx.revealed=true;render();
  const lab={correct:'✓ correct',incorrect:'✗ incorrect',noattempt:"didn't attempt"}[result];
  toast(`${esc(s.student)}: ${lab}`,()=>{k.log=k.log.filter(r=>r.id!==id);save();round=snap;render()})}
function replaceStudent(i,absent){const s=round.slots[i],snap=snapshot(),old=s.student,k=C();
  if(absent){absentToday().push(old);save()}
  const n=pickStudent(round.slots.map(x=>x.student));
  if(!n){if(absent){k.absent.names=k.absent.names.filter(x=>x!==old);save()}return toast('No one else is available.')}
  s.student=n;render();
  toast(absent?`${esc(old)} marked absent today`:`Skipped ${esc(old)}`,()=>{if(absent){k.absent.names=k.absent.names.filter(x=>x!==old);save()}round=snap;render()})}
const parseNames=t=>[...new Set(t.split('\n').map(s=>s.trim()).filter(Boolean))];
// In-page dialogs (the hosted viewer blocks alert/confirm/prompt).
function ask({title,body='',ok='OK',cancel='Cancel',danger=false,input=null,wide=false,extra=''}){return new Promise(res=>{
  const m=$('#modal'),prev=document.activeElement;
  m.innerHTML=`<div class="mback"><div class="mbox${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="mtitle"><h2 id="mtitle">${title}</h2>${body?`<div class="mbody">${body}</div>`:''}${input!==null?`<input type="text" id="minput" value="${esc(input)}" aria-label="${title}">`:''}${extra}<div class="row mrow">${cancel?`<button class="btn" id="mcancel">${cancel}</button>`:''}${ok?`<button class="btn ${danger?'dangerfill':'primary'}" id="mok">${ok}</button>`:''}</div></div></div>`;
  const close=v=>{document.removeEventListener('keydown',kh,true);m.innerHTML='';try{prev&&prev.focus()}catch(e){}res(v)};
  const okv=()=>input!==null?$('#minput').value:true,nov=input!==null?null:false;
  const kh=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(nov)}else if(e.key==='Enter'&&e.target.id==='minput'){e.preventDefault();e.stopPropagation();close(okv())}};
  document.addEventListener('keydown',kh,true);
  m.querySelector('.mback').addEventListener('click',e=>{if(e.target.classList.contains('mback'))close(nov)});
  if($('#mcancel'))$('#mcancel').onclick=()=>close(nov);
  if($('#mok'))$('#mok').onclick=()=>close(okv());
  m._close=close;
  const f=$('#minput')||$('#mok')||$('#mcancel');if(f){f.focus();if(f.select)f.select()}})}
const modalOpen=()=>!!$('#modal').innerHTML;
// Saving a file: Claude's save prompt on claude.ai, a normal download anywhere else, otherwise copyable text.
const DL=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function offerFile(obj,filename,what){const text=JSON.stringify(obj,null,1);
  const dl=await DL;
  if(dl){try{await dl.save({filename,data:text});toast(`Saved ${esc(filename)}`);return}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited')return toast('A save prompt is already open.')}}
  else if(!window.claude){const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),l=document.createElement('a');
    l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
  ask({title:`Copy your ${what}`,wide:true,ok:'Copy',cancel:'Close',
    body:`Saving files isn't available here. Copy this text and keep it somewhere safe, such as a note or an email to yourself. To restore it, choose Import and paste the text.`,
    extra:`<textarea id="mtext" rows="9" readonly aria-label="${what} text">${esc(text)}</textarea>`});
  $('#mok').onclick=async()=>{const ta=$('#mtext');try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){ta.focus();ta.select();toast('Text selected. Use Copy from your device\'s menu.')}}}
function chooseImport(kind){
  ask({title:kind==='backup'?'Import a backup':'Import skills',wide:true,ok:'Import pasted text',cancel:'Cancel',
    body:kind==='backup'?'Choose a backup file, or paste backup text below. This replaces the classes, rosters, history and skills on this device.':'Choose a skills file, or paste skills text below. Skills with the same name are updated; the rest are added.',
    extra:`<div class="row"><button class="btn" id="mfile">Choose file…</button></div><textarea id="mtext" rows="7" placeholder="Paste text here" aria-label="Paste text"></textarea>`});
  const box=$('#modal');
  $('#mfile').onclick=()=>{$(kind==='backup'?'#importFile':'#importSkills').click();box._close(false)};
  $('#mok').onclick=()=>{const txt=$('#mtext').value.trim();if(!txt)return toast('Paste the text first.');box._close(false);importText(txt,kind)}}
function importText(txt,kind){
  if(kind==='backup'){let d;try{d=normalize(JSON.parse(txt))}catch(e){return ask({title:"That isn't a warm-up backup",body:'Check that you chose or pasted the whole backup, starting with { and ending with }.',cancel:null})}
    const turns=d.classes.reduce((s,k)=>s+k.log.length,0);
    return ask({title:'Replace everything on this device?',body:`The backup has ${d.classes.length} class${d.classes.length===1?'':'es'} and ${turns} recorded turn${turns===1?'':'s'}. It replaces what is here now.`,ok:'Replace',danger:true})
      .then(ok=>{if(ok){S=d;save();round=null;render();toast('Backup imported')}})}
  let list;try{const d=JSON.parse(txt);list=d&&d.kind==='warmup-skills'?d.skills:(d&&Array.isArray(d.custom)?d.custom:null);if(!Array.isArray(list))throw 0}
  catch(e){return ask({title:"That isn't a skills file",body:'Use a file made with “Export my added skills”, or a full backup.',cancel:null})}
  let added=0,upd=0;
  list.forEach(sk=>{if(!sk||!sk.name||!Array.isArray(sk.items))return;const ex=S.custom.find(c=>c.id===sk.id||c.name.toLowerCase()===sk.name.toLowerCase());
    if(ex){ex.name=sk.name;ex.items=sk.items;upd++}else{S.custom.push({id:sk.id||'c-'+uid(),name:sk.name,items:sk.items});added++}});
  save();render();toast(`Skills imported: ${added} new, ${upd} updated`)}
function setAll(on){const k=C();cats(true).forEach(c=>{k.enabled[c.id]=on});save();round=null;render()}

document.addEventListener('click',e=>{if(e.target.closest('#modal'))return;const t=e.target.closest('[data-act],[data-tab]');if(!t||t.disabled)return;
  if(t.dataset.tab){tab=t.dataset.tab;return render()}
  const a=t.dataset.act;
  if(a==='fs')return fsToggle();
  if(a==='newround')return newRound();
  if(a==='lvl'){C().level=+t.dataset.v;save();renderHeader();return toast(`Max difficulty for ${esc(C().name)}: ${t.dataset.v}. Applies to new problems.`)}
  const i=+t.dataset.i,sl=round&&round.slots[i];
  if(a==='reveal'){if(sl)sl.revealed=true;return render()}
  if(a==='toggle'){if(sl)sl.shown=!sl.shown;return render()}
  if(a==='newprob'){if(sl)fill(sl,cats(true).find(c=>c.id===sl.cat));return render()}
  if(a==='rec')return record(i,t.dataset.r);
  if(a==='absent')return replaceStudent(i,true);
  if(a==='someoneelse')return replaceStudent(i,false);
  if(a==='unabsent'){const k=C();k.absent.names=k.absent.names.filter(x=>x!==t.dataset.name);save();return render()}
  if(a==='undo'){const u=window._undo;$('#toast').innerHTML='';window._undo=null;if(u)u();return}
  if(a==='del'){const id=t.dataset.id;ask({title:'Delete this turn?',body:'It is removed from the history and coverage.',ok:'Delete',danger:true}).then(ok=>{if(ok){const k=C();k.log=k.log.filter(r=>r.id!==id);save();render()}});return}
  if(a==='selclass'){S.current=t.dataset.id;round=null;save();return render()}
  if(a==='addclass'){const name=$('#newcname').value.trim();if(!name){toast('Give the class a name.');$('#newcname').focus();return}
    const k=newClass(name,parseNames($('#newcroster').value));S.classes.push(k);S.current=k.id;round=null;save();toast(`Added ${esc(name)}`);return render()}
  if(a==='renclass'){const k=S.classes.find(c=>c.id===t.dataset.id);ask({title:'Rename class',input:k.name,ok:'Rename'}).then(n=>{if(n&&n.trim()){k.name=n.trim();save();render()}});return}
  if(a==='delclass'){const k=S.classes.find(c=>c.id===t.dataset.id);
    ask({title:`Delete ${esc(k.name)}?`,body:`This removes its roster and all ${k.log.length} recorded turn${k.log.length===1?'':'s'}. Export a backup first if you might want them.`,ok:'Delete class',danger:true}).then(ok=>{if(ok){
      S.classes=S.classes.filter(c=>c!==k);if(S.current===k.id){S.current=S.classes[0]?S.classes[0].id:null;round=null}save();render()}});return}
  if(a==='saveroster'){C().students=parseNames($('#roster').value);save();round=null;toast('Roster saved');return render()}
  if(a==='allon')return setAll(true);
  if(a==='alloff')return setAll(false);
  if(a==='editcat'){editing=t.dataset.id;render();$('#cname').scrollIntoView({behavior:'smooth',block:'center'});return}
  if(a==='canceledit'){editing=null;return render()}
  if(a==='delcat'){const c=S.custom.find(c=>c.id===t.dataset.id);if(c)ask({title:`Delete “${esc(c.name)}”?`,body:'It is removed from all classes. Past turns stay in the history, marked as a deleted skill.',ok:'Delete skill',danger:true}).then(ok=>{if(ok){S.custom=S.custom.filter(x=>x!==c);save();if(usesCat(c.id))round=null;render()}});return}
  if(a==='savecat'){const name=$('#cname').value.trim();const items=$('#citems').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('|');return i<0?{q:l,a:''}:{q:l.slice(0,i).trim(),a:l.slice(i+1).trim()}}).filter(x=>x.q);
    if(!name){toast('Give the skill a name.');$('#cname').focus();return}if(!items.length){toast('Add at least one problem.');$('#citems').focus();return}
    if(editing){const c=S.custom.find(c=>c.id===editing);c.name=name;c.items=items}else S.custom.push({id:'c-'+uid(),name,items});
    editing=null;save();toast(`Saved "${esc(name)}"`);return render()}
  if(a==='export')return offerFile(S,`algebra2-warmups-backup-${todayStr()}.json`,'backup');
  if(a==='import')return chooseImport('backup');
  if(a==='exportskills')return offerFile({kind:'warmup-skills',version:1,skills:S.custom},`algebra2-warmup-skills-${todayStr()}.json`,'skills');
  if(a==='importskills')return chooseImport('skills');
  if(a==='clearclass'){const k=C();ask({title:`Clear ${esc(k.name)} history?`,body:'All recorded turns for this class are removed. The roster and skills are kept.',ok:'Clear history',danger:true}).then(ok=>{if(ok){k.log=[];k.absent={date:'',names:[]};save();round=null;render()}});return}
  if(a==='clearall'){ask({title:'Clear history for all classes?',body:'Recorded turns are removed for every class. Rosters and skills are kept. Export a backup first if you might want it.',ok:'Clear all history',danger:true}).then(ok=>{if(ok){S.classes.forEach(k=>{k.log=[];k.absent={date:'',names:[]}});save();round=null;render()}});return}
});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
  if(t.id==='classpick'){S.current=t.value;round=null;save();return render()}
  if(a==='setcat'){fill(round.slots[+t.dataset.i],cats(true).find(c=>c.id===t.value));return render()}
  if(a==='togglecat'){const id=t.dataset.id;C().enabled[id]=t.checked;save();if(!t.checked&&usesCat(id))round=null;return render()}
  if((t.id==='importFile'||t.id==='importSkills')&&t.files[0]){const kind=t.id==='importFile'?'backup':'skills';t.files[0].text().then(txt=>importText(txt,kind)).finally(()=>{t.value=''})}});
document.addEventListener('keydown',e=>{if(modalOpen()||tab!=='warm'||!C()||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'||e.key===' ')e.preventDefault();
  const act=activeIdx();
  if(e.key==='Enter'){if(!round||act<0)return newRound();const s=round.slots[act];if(!s.revealed){s.revealed=true;render()}return}
  if(!round)return;const s=round.slots[act<0?round.slots.length-1:act];
  if(e.key===' '){s.shown=!s.shown;render()}
  else if(act>=0&&'123'.includes(e.key))record(act,{1:'correct',2:'incorrect',3:'noattempt'}[e.key]);});

// Full screen: one tap hides the browser and system bars (hidden where the browser can't do it, or when already running as an installed full-screen app).
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsSync(){const b=$('#fsbtn'),can=document.fullscreenEnabled||document.webkitFullscreenEnabled,inst=matchMedia('(display-mode: fullscreen)').matches;
  b.hidden=!can||(inst&&!fsEl());b.textContent=fsEl()?'Exit full screen':'Full screen'}
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);
function fsToggle(){const d=document.documentElement;
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>toast("Full screen isn't available here."))}}
if(typeof document!=='undefined'&&document.getElementById('main')){load();save();render();fsSync()}
</script>
</body>
